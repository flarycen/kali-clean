# Neon — richer cyber aesthetic, still opaque and compositor-free.
client.focused          #66e3ff #070914 #dbe7ff #66e3ff #66e3ff
client.focused_inactive #252a41 #070914 #75809d #252a41 #252a41
client.unfocused        #15182a #070914 #75809d #15182a #15182a
client.urgent           #ff5f87 #ff5f87 #ffffff #ff5f87 #ff5f87
client.placeholder      #15182a #070914 #75809d #15182a #15182a
client.background       #070914

bar {
    position top
    mode dock
    workspace_buttons yes
    binding_mode_indicator yes
    strip_workspace_numbers no
    tray_output primary
    tray_padding 3
    font pango:Geist Mono 10
    status_command /usr/bin/python3 ~/.config/i3/status.py

    colors {
        background         #000000
        statusline         #a8b6d7
        separator          #1b2136
        focused_workspace  #66e3ff #66e3ff #05070c
        active_workspace   #5b4b8a #17142a #d7c7ff
        inactive_workspace #000000 #000000 #6e7791
        urgent_workspace   #ff5f87 #ff5f87 #ffffff
        binding_mode       #141a2e #141a2e #dbe7ff
    }
}
