# Obsidian tmux theme.
set -g status-style 'bg=#000000,fg=#737a84'
set -g message-style 'bg=#15181d,fg=#d8dce2'
set -g mode-style 'bg=#d8dce2,fg=#08090b'
set -g pane-border-style 'fg=#252930'
set -g pane-active-border-style 'fg=#9aa3b0'
set -g display-panes-colour '#555d68'
set -g display-panes-active-colour '#d8dce2'
set -g window-status-separator ''
set -g window-status-style 'bg=#000000,fg=#606873'
set -g window-status-format ' #I:#W '
set -g window-status-current-style 'bg=#d8dce2,fg=#08090b,bold'
set -g window-status-current-format ' #I:#W '
set -g status-left '#[bg=#15181d,fg=#d8dce2,bold] #S #[bg=#000000,fg=#343942] │ #[default]'
set -g status-left-length 40
set -g status-right '#[fg=#68707b]#{pane_current_path}  #[fg=#a8afb8]%H:%M '
set -g status-right-length 90
