# Obsidian — ultra-minimal monochrome theme.
client.focused          #8b95a3 #08090b #d8dce2 #8b95a3 #8b95a3
client.focused_inactive #23272e #08090b #6d747e #23272e #23272e
client.unfocused        #15181d #08090b #6d747e #15181d #15181d
client.urgent           #a15a63 #a15a63 #ffffff #a15a63 #a15a63
client.placeholder      #15181d #08090b #6d747e #15181d #15181d
client.background       #08090b

bar {
    position top
    mode dock
    workspace_buttons yes
    binding_mode_indicator yes
    strip_workspace_numbers no
    tray_output primary
    tray_padding 3
    font pango:Geist Mono 10
    status_command /usr/bin/python3 ~/.config/i3/status.py

    colors {
        background         #000000
        statusline         #9aa1ab
        separator          #1d2026
        focused_workspace  #d8dce2 #d8dce2 #08090b
        active_workspace   #171a20 #171a20 #b7bdc6
        inactive_workspace #000000 #000000 #5f6670
        urgent_workspace   #a15a63 #a15a63 #ffffff
        binding_mode       #171a20 #171a20 #d8dce2
    }
}
