[general]
import = ["~/.config/kali-clean/current/alacritty-theme.toml"]
live_config_reload = true

[window]
decorations = "None"
dynamic_padding = false
opacity = 1.0
padding = { x = 12, y = 10 }

[scrolling]
history = 20000
multiplier = 3

[font]
size = 12.5
normal = { family = "Geist Mono", style = "Regular" }
bold = { family = "Geist Mono", style = "Bold" }
italic = { family = "Geist Mono", style = "Italic" }
bold_italic = { family = "Geist Mono", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true
