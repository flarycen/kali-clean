# kali-clean — Alacritty
# Pebl3 near-black base, JetBrains Mono, ANSI colors tuned bright for black.
# Bold text is drawn with the bright palette, so bold commands render pure white.
# (Live config reload is on by default; no [general] section keeps every
#  Alacritty version from showing an "unused key" banner.)

[env]
# xterm-256color is understood by every target you SSH into; "alacritty" is not.
TERM = "xterm-256color"

[window]
decorations = "None"
dynamic_padding = true
opacity = 1.0
padding = { x = 12, y = 10 }

[scrolling]
history = 50000
multiplier = 3

[font]
size = 11.5
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#060606"
foreground = "#f5f5f5"
dim_foreground = "#a1a1aa"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#060606"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text = "#060606"
cursor = "#a1a1aa"

[colors.selection]
text = "#ffffff"
background = "#3f3f46"

[colors.search.matches]
foreground = "#060606"
background = "#a1a1aa"

[colors.search.focused_match]
foreground = "#060606"
background = "#ffffff"

[colors.footer_bar]
foreground = "#f5f5f5"
background = "#1f1f1f"

[colors.normal]
black   = "#27272a"
red     = "#f87171"
green   = "#4ade80"
yellow  = "#facc15"
blue    = "#60a5fa"
magenta = "#c084fc"
cyan    = "#22d3ee"
white   = "#d4d4d8"

[colors.bright]
black   = "#71717a"
red     = "#fca5a5"
green   = "#86efac"
yellow  = "#fde047"
blue    = "#93c5fd"
magenta = "#d8b4fe"
cyan    = "#67e8f9"
white   = "#ffffff"
