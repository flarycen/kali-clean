[general]
live_config_reload = true

[window]
decorations = "None"
dynamic_padding = false
opacity = 1.0
padding = { x = 10, y = 8 }

[font]
size = 12.5
normal = { family = "Geist Mono", style = "Regular" }
bold = { family = "Geist Mono", style = "Bold" }
italic = { family = "Geist Mono", style = "Italic" }

[colors.primary]
background = "#0b0b0b"
foreground = "#c8c8c8"

[colors.normal]
black   = "#111111"
red     = "#b86a6a"
green   = "#86a986"
yellow  = "#b3a16f"
blue    = "#7891a8"
magenta = "#9b82a6"
cyan    = "#7da2a2"
white   = "#c8c8c8"

[colors.bright]
black   = "#555555"
red     = "#d18484"
green   = "#9fbd9f"
yellow  = "#c9b77f"
blue    = "#91a8bd"
magenta = "#b39abc"
cyan    = "#95b9b9"
white   = "#eeeeee"

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true
