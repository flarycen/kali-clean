# kali-clean tmux — native controls + theme layer
# Ctrl-b remains the prefix. Stock split/window/copy bindings are preserved.

set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',alacritty:RGB'
set -g escape-time 0
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g automatic-rename on
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g display-panes-time 1200

# Refresh desktop/agent state when attaching to a long-lived server.
set -g update-environment "DISPLAY WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_RUNTIME_DIR XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY KRB5CCNAME KALI_CLEAN_VPN_INTERFACES"

# One additive convenience binding. Native tmux bindings stay untouched.
bind-key r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Theme is a stable symlink changed by Mod+Shift+T.
source-file -q ~/.config/kali-clean/current/tmux-theme.conf
