# kali-clean — tmux
# Ctrl-b and every stock binding behave exactly as in plain tmux. Extras only
# use keys that stock tmux leaves unbound:
#
#   prefix + P           start/stop logging this pane to ~/logs/tmux   (tmux-logging)
#   prefix + Alt-Shift-p save this pane's complete history to a file   (tmux-logging)
#   prefix + Alt-s       save the visible screen to a file              (tmux-logging)
#   prefix + Alt-c       clear this pane's history                       (tmux-logging)
#   prefix + Ctrl-s      save all sessions/panes/dirs                    (tmux-resurrect)
#   prefix + Ctrl-r      restore them after a reboot                     (tmux-resurrect)
#   prefix + R           reload this file
#
# Changed behaviour, same keys: % " and c open in the current directory, and
# every copy (mouse or copy-mode) also lands in the system/VM clipboard.

# ------------------------------------------------------------------ core
# screen-256color exists on every box you will SSH into (tmux-256color may not).
set -g default-terminal "screen-256color"
set -as terminal-features ',xterm-256color:RGB,alacritty*:RGB'
set -s escape-time 0
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
setw -g automatic-rename on
set -g display-time 2000
set -g status-interval 5
set -g update-environment "DISPLAY WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_RUNTIME_DIR XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY KRB5CCNAME"

# Clipboard: OSC 52 to Alacritty plus xclip, so copies reach the VMware host.
set -s set-clipboard on
set -s copy-command 'xclip -selection clipboard -in'

# ------------------------------------------------------------------ same keys, keep cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# Reload (capital R; lowercase r stays tmux's redraw).
bind R source-file ~/.tmux.conf \; display-message ' tmux.conf reloaded'

# ------------------------------------------------------------------ look
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#0a0a0a,fg=#71717a'
set -g status-left-length 40
set -g status-left '#{?client_prefix,#[fg=#060606#,bg=#ffffff#,bold],#[fg=#ffffff#,bg=#1f1f1f#,bold]} #S #[default] '
set -g window-status-separator ''
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-style 'fg=#71717a,bg=#0a0a0a'
set -g window-status-current-style 'fg=#ffffff,bg=#1f1f1f,bold'
set -g window-status-activity-style 'fg=#f5f5f5,bg=#0a0a0a'
set -g window-status-bell-style 'fg=#ef4444,bg=#0a0a0a,bold'
set -g status-right-length 90
set -g status-right '#{?pane_synchronized,#[fg=#ef4444#,bold]SYNC #[default]#[fg=#3f3f46]· ,}#(python3 ~/.config/kali-clean/kcinfo.py tmux) #[fg=#3f3f46]· #[fg=#ffffff]%H:%M '

set -g pane-border-style 'fg=#1f1f1f'
set -g pane-active-border-style 'fg=#ffffff'
set -g message-style 'bg=#1f1f1f,fg=#ffffff'
set -g message-command-style 'bg=#1f1f1f,fg=#ffffff'
set -g mode-style 'bg=#3f3f46,fg=#ffffff'
set -g display-panes-colour '#52525b'
set -g display-panes-active-colour '#ffffff'
setw -g clock-mode-colour '#ffffff'

# ------------------------------------------------------------------ plugins
# Installed by install.sh into ~/.tmux/plugins (no TPM needed). If a plugin is
# missing, tmux simply starts without it.
run-shell 'mkdir -p "$HOME/logs/tmux" && tmux set -g @logging-path "$HOME/logs/tmux" \; set -g @screen-capture-path "$HOME/logs/tmux" \; set -g @save-complete-history-path "$HOME/logs/tmux"'
set -g @screen-capture-key 'M-s'
set -g @resurrect-capture-pane-contents 'on'
if-shell 'test -f ~/.tmux/plugins/tmux-logging/logging.tmux' 'run-shell ~/.tmux/plugins/tmux-logging/logging.tmux'
if-shell 'test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
