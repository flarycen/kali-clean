# kali-clean tmux
# Keep native tmux keybindings intact. Prefix remains Ctrl-b.
# Standard splits therefore continue to work exactly as tmux documents:
#   Ctrl-b %  -> left/right split
#   Ctrl-b "  -> top/bottom split
#   Ctrl-b c  -> new window
#   Ctrl-b arrows -> change pane

set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',alacritty:RGB'
set -g escape-time 0
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g automatic-rename on

# Refresh display/agent state when attaching to a long-lived tmux server.
# Arbitrary lab variables (ip, ip2, domain, MY_VAR, etc.) are synchronized by
# ~/.config/kali-clean/env-sync.zsh and are intentionally not hard-coded here.
set -g update-environment "DISPLAY WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_RUNTIME_DIR XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY KRB5CCNAME KALI_CLEAN_VPN_INTERFACES"

# One additive QoL binding: reload this config. All stock tmux creation/split,
# copy-mode, resize, detach and pane-navigation bindings remain untouched.
bind-key r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Flat monochrome status line to match the i3 desktop.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#0b0b0b,fg=#777777'
set -g message-style 'bg=#252525,fg=#eeeeee'
set -g mode-style 'bg=#303030,fg=#eeeeee'
set -g pane-border-style 'fg=#222222'
set -g pane-active-border-style 'fg=#555555'
set -g window-status-separator ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'bg=#303030,fg=#eeeeee,bold'
set -g status-left ' #S '
set -g status-left-length 30
set -g status-right '#{pane_current_path}  %H:%M '
set -g status-right-length 80
